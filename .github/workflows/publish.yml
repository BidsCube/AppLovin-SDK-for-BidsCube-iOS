name: Publish SDK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [[ -z "$VERSION" ]]; then
              echo "::error::No git tag found."
              exit 1
            fi
            VERSION=${VERSION#v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify version alignment
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MODERN=$(grep -m1 'spec\.version' BidscubeSDKAppLovin.podspec | sed -n 's/.*spec\.version[^"]*"\([^"]*\)".*/\1/p')
          LEGACY=$(grep -m1 'spec\.version' BidscubeSDKAppLovinLegacy.podspec | sed -n 's/.*spec\.version[^"]*"\([^"]*\)".*/\1/p')
          SDK=$(grep 'sdkVersion' bidscubeSdk/Core/Constants.swift | sed -n 's/.*"\([^"]*\)".*/\1/p')
          test "$MODERN" = "$VERSION"
          test "$LEGACY" = "$VERSION"
          test "$SDK" = "$VERSION"
          test -f "BidscubeSDKAppLovin/${VERSION}/BidscubeSDKAppLovin.podspec"
          test -f "BidscubeSDKAppLovinLegacy/${VERSION}/BidscubeSDKAppLovinLegacy.podspec"

      - name: Sync in-repo CocoaPods spec
        run: ./scripts/sync-cocoapods-spec.sh

      - name: Ensure sync did not modify tracked specs
        run: git diff --exit-code

      - name: Lint modern podspec
        run: pod lib lint BidscubeSDKAppLovin.podspec --allow-warnings --verbose

      - name: Lint legacy podspec
        run: pod lib lint BidscubeSDKAppLovinLegacy.podspec --allow-warnings --verbose

      - name: Install pod dependencies for sample workspace
        run: pod install

      - name: Build modern sample app
        run: |
          xcodebuild build \
            -workspace bidscubeSdk.xcworkspace \
            -scheme testApp-ios \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Build legacy integration
        run: chmod +x scripts/build-legacy-integration.sh && ./scripts/build-legacy-integration.sh

      - name: Run unit tests
        run: chmod +x scripts/run-unit-tests.sh && ./scripts/run-unit-tests.sh

      - name: Validate Package.swift
        run: |
          swift package resolve
          swift package describe --type json > /dev/null

  publish-release:
    name: Create GitHub Release
    runs-on: macos-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "Release ${{ steps.version.outputs.version }}" \
            --notes "$(cat <<EOF
          ## BidscubeSDKAppLovin v${{ steps.version.outputs.version }}

          Install via in-repo CocoaPods spec (no Trunk):

          \`\`\`ruby
          # Modern, iOS 15+
          source 'https://github.com/BidsCube/AppLovin-SDK-for-BidsCube-iOS.git'
          source 'https://cdn.cocoapods.org/'

          platform :ios, '15.0'
          pod 'BidscubeSDKAppLovin', '${{ steps.version.outputs.version }}'
          \`\`\`

          \`\`\`ruby
          # Legacy, iOS 14+
          source 'https://github.com/BidsCube/AppLovin-SDK-for-BidsCube-iOS.git'
          source 'https://cdn.cocoapods.org/'

          platform :ios, '14.0'
          pod 'BidscubeSDKAppLovinLegacy', '${{ steps.version.outputs.version }}'
          \`\`\`

          Install only one Bidscube AppLovin pod per target.
          EOF
          )"
